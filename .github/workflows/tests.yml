name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  quality:
    name: Calidad y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas unitarias, contratos y umbral de cobertura
        run: pnpm test:coverage

      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Comprobar estilo y reglas de Next.js
        run: pnpm lint

      - name: Verificar tipos generados de Payload
        env:
          PAYLOAD_SECRET: ci-payload-secret-with-at-least-32-characters
        run: |
          pnpm payload:generate
          git diff --exit-code -- payload-types.ts

  application:
    name: PostgreSQL, Payload y aplicación completa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pls_al_llamado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pls_al_llamado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pls_al_llamado_test
      PAYLOAD_SECRET: ci-payload-secret-with-at-least-32-characters
      NEXT_PUBLIC_SERVER_URL: https://ci.pls-al-llamado.test
      R2_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile

      - name: Preparar esquema y datos controlados
        run: |
          touch .env
          pnpm payload:seed

      - name: Probar Payload contra PostgreSQL
        run: pnpm test:integration

      - name: Compilar como producción
        run: pnpm build

      - name: Iniciar aplicación y esperar healthcheck
        run: |
          pnpm start > "$RUNNER_TEMP/pls-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pls-server.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "La aplicación no respondió al healthcheck."
          exit 1

      - name: Probar páginas, APIs, sesiones, roles y CRUD
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          TEST_ORIGIN: https://ci.pls-al-llamado.test
        run: pnpm test:e2e

      - name: Guardar log del servidor si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: servidor-next
          path: ${{ runner.temp }}/pls-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Detener aplicación
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pls-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pls-server.pid")" 2>/dev/null || true
          fi
